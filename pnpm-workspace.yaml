packages:
  - "packages/*"
  - "apps/*"

# Shared dependency versions. Workspace manifests reference these with the
# `catalog:` protocol so every package resolves identically. Internal
# workspace links use `workspace:*`.
catalog:
  typescript: 6.0.3
  next: 16.4.6
  fumadocs-core: 16.19.4
  fumadocs-ui: 16.19.4
  fumadocs-mdx: 15.6.3
  fumadocs-typescript: 5.6.2
  "@types/mdx": 2.0.14
  vitest: 5.1.0
  "@vitest/coverage-v8": 5.1.0
  vite: 6.4.5
  downshift: 9.5.0
  eslint: 9.39.5
  "@eslint/js": 9.39.5
  typescript-eslint: 8.73.0
  "@types/node": 26.6.6
  turbo: 2.11.11
  "@changesets/cli": 3.0.3
  "@microsoft/api-extractor": 7.60.1
  "@arethetypeswrong/cli": 0.18.5
  publint: 0.3.25
  ulid: 3.0.2
  "@fastify/static": 10.1.11
  "@nestjs/common": 12.5.1
  "@nestjs/config": 12.1.1
  "@nestjs/core": 12.5.1
  "@nestjs/platform-fastify": 12.5.1
  "@nestjs/swagger": 12.1.2
  "@nestjs/throttler": 6.8.0
  "@swc/core": 1.16.22
  "@types/supertest": 7.2.1
  class-transformer: 0.5.1
  class-validator: 0.15.1
  # Single fastify for the Nest closure: @nestjs/platform-fastify pins an exact
  # fastify, so a catalog-only bump leaves two type identities (nest typecheck
  # fails at factory.ts useBodyParser). Keep equal to pnpm.overrides.fastify;
  # lift the override once Nest ships fastify >= the catalog version.
  fastify: 5.12.8
  nestjs-pino: 5.3.2
  pino: 10.4.0
  pino-http: 11.0.0
  posthog-js: 1.450.0
  reflect-metadata: 0.2.2
  supertest: 7.3.2
  unplugin-swc: 2.0.0
  yaml: 2.9.1
  react: 19.3.1
  react-dom: 19.3.1
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  tailwindcss: 4.3.5
  "@tailwindcss/postcss": 4.3.5
